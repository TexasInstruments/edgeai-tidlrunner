# VGGish11 sound classification -- TVM runtime (tvmrt) trial variant
# Usage: tidlrunner-cli {compile,infer,evaluate} --config_path data/configs/samples/models/audio/audio_classification/urbansound8k/vggish11_tvmrt_config.yaml
# tvmrt config of ac-0100 (onnxrt). Compiles the same FP32 ONNX model through the TVM runtime instead of ONNXRuntime.
task_type: audio_classification
dataloader:
  name: audio_classification_dataloader
  path: ./data/datasets/UrbanSound8K
  fold: 10  # standard test fold (837 samples)
preprocess:
  audio_model_type: vggish11  # dispatches VGGishMelSpectrogram in from_kwargs()
  sample_rate: 16000
  audio_duration: 4.0  # pad/crop to 4s → 126 mel time frames
postprocess: {}  # dispatched via PostProcessTransforms.from_kwargs() using task_type
session:
  session_name: tvmrt
  target_device: AM62D
  tidl_offload: true
  input_optimization: false  # disable image-specific input normalization
  input_mean: null  # override image default
  input_scale: null  # override image default
  runtime_options:
    tensor_bits: 8
    accuracy_level: 1
    advanced_options:calibration_frames: 100
    advanced_options:calibration_iterations: 2
  model_path: vggish11.onnx
  model_id: ac-0101
  input_details: null
  output_details: null
  num_inputs: 1
model_info:
  metric_reference:
    accuracy_top1%: 77.0  # TIDL INT8 (tidl_offload=1), fold-10, 837 samples
  compact_name: vggish11_tvmrt
  shortlisted: true
