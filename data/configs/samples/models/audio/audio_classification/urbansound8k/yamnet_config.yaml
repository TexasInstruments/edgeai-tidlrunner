# YAMNet sound classification
# Usage: tidlrunner-cli {compile,infer,evaluate} --config_path data/configs/subset/models/audio/audio_classification/urbansound8k/yamnet_config.yaml
task_type: audio_classification
dataloader:
  name: audio_classification_dataloader
  path: ./data/datasets/UrbanSound8K
  fold: 10  # standard test fold (837 samples)
preprocess:
  audio_model_type: yamnet  # dispatches YAMNetMelSpectrogram in from_kwargs()
  sample_rate: 16000
  # audio_duration intentionally omitted — YAMNet always uses the first 96-frame patch
  # regardless of audio length; pad/crop logic is inside YAMNetMelSpectrogram
postprocess: {}  # dispatched via PostProcessTransforms.from_kwargs() using task_type
session:
  session_name: onnxrt
  target_device: AM62A
  tidl_offload: true
  input_optimization: false  # disable image-specific input normalization
  input_mean: null  # override image default (123.675, 116.28, 103.53)
  input_scale: null  # override image default (0.017125, 0.017507, 0.017429)
  runtime_options:
    accuracy_level: 1  # FP32 model; TIDL performs INT8 quantization at compile time
    max_num_subgraphs: 16
    ti_internal_nc_flag: 83886080
    tensor_bits: 8
    advanced_options:calibration_frames: 100
    advanced_options:calibration_iterations: 2
    advanced_options:mixed_precision_factor: -1
    advanced_options:quantization_scale_type: 0
    advanced_options:pre_batchnorm_fold: 1
    advanced_options:activation_clipping: 1  # preset internally for accuracy_level 0/1
    advanced_options:weight_clipping: 1
    advanced_options:bias_calibration: 1
    advanced_options:add_data_convert_ops: 3
    advanced_options:channel_wise_quantization: 0
  model_path: yamnet_combined.onnx
  model_id: ac-0200
  input_details: null
  output_details: null
  num_inputs: 1
model_info:
  metric_reference:
    accuracy_top1%: 54.0  # INT8 TIDL (tidl_offload=1), fold-10, 837 samples, AudioSet→US8K mapping
  compact_name: yamnet
  shortlisted: true
