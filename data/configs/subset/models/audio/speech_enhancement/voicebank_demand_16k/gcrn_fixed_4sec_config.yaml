# GCRN speech enhancement (ARM-only, no TIDL offload)
# Usage: tidlrunner-cli {compile,infer,evaluate} --config_path data/configs/subset/models/audio/speech_enhancement/voicebank_demand_16k/gcrn_config.yaml
# Note: GCRN not yet supported by TIDL; runs on ARM Cortex-A only (tidl_offload: false)
# Note: GCRN expects fixed 4-second input; GCRNSTFTTransform pads/truncates to audio_duration*sample_rate samples
task_type: audio_speechenhancement
dataloader:
  name: speech_enhancement_dataloader
  path: ./data/datasets/VoiceBank-DEMAND-16k
preprocess:
  sample_rate: 16000
  audio_model_type: gcrn  # dispatches GCRNSTFTTransform (Hamming window, n_fft=320, hop=160, center=True)
  audio_duration: 4.0     # pad/truncate to 4s; GCRN expects exactly (1, 2, 401, 161)
postprocess: {}  # dispatched via PostProcessTransforms.from_kwargs() using task_type
model_surgery: false
session:
  session_name: onnxrt
  target_device: AM62A
  tidl_offload: false  # ARM-only execution; GCRN not yet supported by TIDL
  input_optimization: false  # disable image-specific input normalization
  input_mean: null  # override image default (123.675, 116.28, 103.53)
  input_scale: null  # override image default (0.017125, 0.017507, 0.017429)
  model_path: gcrn_fixed_4sec.onnx
  model_id: ase-0200
  input_details: null
  output_details: null
  num_inputs: 1
model_info:
  metric_reference:
    pesq: 2.246     # GCRN 4sec, ARM CPU FP32, VoiceBank-DEMAND-16k test set (824 files)
    stoi: 0.922
    si_sdr_db: 17.7
  compact_name: gcrn_4sec
  shortlisted: true
